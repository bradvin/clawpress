name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  php:
    name: PHP (Unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHP Unit tests
        run: composer test
      - name: Run PHP CodeSniffer
        run: composer lint

  lint-js:
    name: JS Lint (full, conditional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed-js
        uses: dorny/paths-filter@v3
        with:
          filters: |
            js:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
      - uses: actions/setup-node@v4
        if: steps.changed-js.outputs.js == 'true'
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        if: steps.changed-js.outputs.js == 'true'
        run: npm ci
      - name: Run full JS lint
        if: steps.changed-js.outputs.js == 'true'
        run: npm run lint:js
      - name: Skip JS lint (no JS changes)
        if: steps.changed-js.outputs.js != 'true'
        run: echo "No JS changes; skipping JS lint."

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run plugin standards check
        run: npm run plugin:check

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  php:
    name: PHP (Unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PHP toolchain
        run: |
          php -r "exit( version_compare( PHP_VERSION, '8.1', '>=' ) ? 0 : 1 );"
          php -v
          composer --version
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHP Unit tests
        run: composer test
      - name: Run PHP CodeSniffer
        run: composer lint

  lint-js:
    name: JS Lint (full, conditional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed-js
        name: Detect JS changes
        run: |
          if [ "${AGENT_CI_LOCAL:-}" = "true" ]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_ref="${GITHUB_BASE_REF:-}"
          if [ -n "$base_ref" ]; then
            git fetch --no-tags --depth=1 origin "$base_ref"
            base="origin/$base_ref"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          merge_base="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"

          if git diff --name-only "$merge_base" HEAD | grep -Eq '\.(js|jsx|mjs|cjs)$'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed-js.outputs.js == 'true'
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        if: steps.changed-js.outputs.js == 'true'
        run: npm ci
      - name: Run full JS lint
        if: steps.changed-js.outputs.js == 'true'
        run: npm run lint:js
      - name: Skip JS lint (no JS changes)
        if: steps.changed-js.outputs.js != 'true'
        run: echo "No JS changes; skipping JS lint."

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    timeout-minutes: 20
    env:
      WP_ENV_CORE: WordPress/WordPress#7.0-branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure PHP toolchain
        run: |
          php -r "exit( version_compare( PHP_VERSION, '8.1', '>=' ) ? 0 : 1 );"
          php -v
          composer --version
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run dist plugin standards check
        run: npm run plugin:check
